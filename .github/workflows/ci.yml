name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install libclang for ffigen
        run: sudo apt-get update && sudo apt-get install -y libclang-dev
      - run: flutter pub get
      - run: flutter pub get
        working-directory: example
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .
      - name: Analyze package (leancode_lint)
        run: flutter analyze
      - name: Analyze example (leancode_lint)
        run: flutter analyze
        working-directory: example
      - name: Check that the FFI bindings are up to date
        run: |
          dart run ffigen --config ffigen.yaml
          git diff --exit-code lib/src/ffi/
      - name: Compile C sources with warnings as errors
        run: |
          for cc in gcc clang; do
            $cc -std=c11 -O2 -Wall -Wextra -Wpedantic -Wconversion -Wshadow -Werror \
              -fsyntax-only src/thumbhash_ffi.c
          done
      - name: Check publishability
        run: flutter pub publish --dry-run

  test:
    name: Unit tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      # Builds the C library for the host with the build hook, then runs the
      # tests against both the native and the pure Dart codec.
      - run: flutter test

  test-min-sdk:
    name: Unit tests (minimum Flutter version)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          # Keep in sync with the lower bound in pubspec.yaml.
          flutter-version: 3.38.10
          channel: stable
          cache: true
      # The latest dev dependencies require a newer SDK, but users of the
      # package never resolve them.
      - run: flutter pub remove leancode_lint ffigen
      - run: flutter test

  test-web:
    name: Unit tests (web, ${{ matrix.compiler }})
    strategy:
      fail-fast: false
      matrix:
        compiler: [dart2js, dart2wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter test --platform chrome ${{ matrix.compiler == 'dart2wasm' && '--wasm' || '' }}

  android:
    name: Example (Android)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: flutter pub get
        working-directory: example
      - name: Build release APK
        run: flutter build apk --release
        working-directory: example
      - name: Run integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: example
          script: flutter test integration_test -d emulator-5554

  ios:
    name: Example (iOS)
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - run: flutter pub get
        working-directory: example
      - name: Build release app
        run: flutter build ios --release --no-codesign
        working-directory: example
      - name: Run integration tests
        working-directory: example
        run: |
          UDID=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))] | last | .udid')
          echo "Using simulator $UDID"
          xcrun simctl boot "$UDID"
          flutter test integration_test -d "$UDID"
      - name: Check that CocoaPods is not used
        run: test ! -e example/ios/Podfile

  macos:
    name: Example (macOS)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Enable Swift Package Manager
        run: flutter config --enable-swift-package-manager
      - run: flutter pub get
        working-directory: example
      - name: Build release app
        run: flutter build macos --release
        working-directory: example
      - name: Run integration tests
        run: flutter test integration_test -d macos
        working-directory: example
      - name: Check that CocoaPods is not used
        run: test ! -e example/macos/Podfile

  linux:
    name: Example (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev xvfb
      - run: flutter pub get
        working-directory: example
      - name: Build release app
        run: flutter build linux --release
        working-directory: example
      - name: Run integration tests
        run: xvfb-run -a flutter test integration_test -d linux
        working-directory: example

  windows:
    name: Example (Windows)
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - name: Build release app
        run: flutter build windows --release
        working-directory: example
      - name: Run integration tests
        run: flutter test integration_test -d windows
        working-directory: example

  web:
    name: Example (web, ${{ matrix.compiler }})
    strategy:
      fail-fast: false
      matrix:
        compiler: [dart2js, dart2wasm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
        working-directory: example
      - name: Build release app
        run: flutter build web --release ${{ matrix.compiler == 'dart2wasm' && '--wasm' || '' }}
        working-directory: example
      - name: Run integration tests
        working-directory: example
        run: |
          "$CHROMEWEBDRIVER/chromedriver" --port=4444 &
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/thumbhash_ffi_test.dart \
            -d web-server --browser-name=chrome --headless \
            ${{ matrix.compiler == 'dart2wasm' && '--wasm' || '' }}
