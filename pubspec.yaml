name: thumbhash_ffi
description: >-
  ThumbHash image placeholder encoder and decoder for Flutter, using the
  reference Rust implementation through dart:ffi and build hooks. Pure Dart
  fallback on the web.
version: 1.0.0
repository: https://github.com/nikodembernat/thumbhash_ffi
issue_tracker: https://github.com/nikodembernat/thumbhash_ffi/issues
topics:
  - thumbhash
  - ffi
  - image
  - placeholder
  - blurhash

environment:
  sdk: ^3.10.0
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  hooks: ^2.0.0
  native_toolchain_rust: ^1.0.4

dev_dependencies:
  ffigen: ^22.0.0
  flutter_test:
    sdk: flutter
  leancode_lint: ^27.0.0
