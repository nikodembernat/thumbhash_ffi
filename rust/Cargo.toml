[package]
name = "thumbhash_ffi"
version = "1.0.0"
edition = "2021"
publish = false
description = "C ABI for the thumbhash crate, used by the thumbhash_ffi Dart package."
license = "MIT"

[lib]
crate-type = ["staticlib", "cdylib"]

[dependencies]
# The reference implementation by Evan Wallace.
thumbhash = "=0.1.0"

[profile.release]
lto = true
codegen-units = 1
