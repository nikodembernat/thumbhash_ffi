# Regenerate the header with `cbindgen --config cbindgen.toml --output thumbhash_ffi.h`
# from this directory.
language = "C"
include_guard = "THUMBHASH_FFI_H_"
autogen_warning = "// Generated by cbindgen from src/lib.rs, do not edit."
header = "// C ABI of the thumbhash crate (https://github.com/evanw/thumbhash)."
cpp_compat = true
documentation_style = "c99"
usize_is_size_t = true

[export]
include = []
