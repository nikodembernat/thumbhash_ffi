# Regenerate the bindings with `dart run ffigen --config ffigen.yaml` after
# regenerating `rust/thumbhash_ffi.h` with cbindgen (see rust/cbindgen.toml).
name: ThumbhashFfiBindings
description: Bindings for `rust/thumbhash_ffi.h`.
output: lib/src/ffi/thumbhash_ffi_bindings.g.dart
headers:
  entry-points:
    - rust/thumbhash_ffi.h
  include-directives:
    - rust/thumbhash_ffi.h
ffi-native:
functions:
  include:
    - thumbhash_.*
  leaf:
    include:
      - thumbhash_.*
macros:
  include:
    - THUMBHASH_.*
  exclude:
    - THUMBHASH_FFI_H_
preamble: |
  // ignore_for_file: type=lint
comments:
  style: any
  length: full
